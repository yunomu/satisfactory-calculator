name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Elm
        run: npm install -g elm uglify-js

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make release

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ap-northeast-1

      - name: Upload to S3
        run: aws s3 sync public/ s3://${{ vars.AWS_S3_BUCKET_NAME }}/${{ vars.AWS_S3_KEY_PREFIX }} --delete --exclude favicon.ico

      - name: Invalidate chache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/${{ vars.AWS_S3_KEY_PREFIX}}*"
