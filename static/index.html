<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <script src="./main.js"></script>
        <title>Satisfactory recipes</title>
    </head>
    <body>
        <main id="app"></main>
<script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });

    var app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: {
            "recipes": "./recipes.csv",
            "items": "./items.csv"
        }
    });
    window.addEventListener("scroll", () => {
        app.ports.scrollY.send(window.scrollY);
    });
    app.ports.renderGraph.subscribe(async ([id, def]) => {
        const svgId = 'mermaid-svg';

        const { svg } = await mermaid.render(svgId, def);

        const container = document.createElement('div');
        container.style.position = 'absolute';
        container.style.visibility = 'hidden';
        container.innerHTML = svg;
        document.body.appendChild(container);

        const img = document.getElementById(id);
        const svgElem = document.getElementById(svgId);
        const rect = svgElem.viewBox.baseVal;
        img.width = rect.width;
        img.height = rect.height;
        img.src = 'data:image/svg+xml;charset=utf-8;base64,' + btoa(unescape(encodeURIComponent(svg)));

        const canvas = document.createElement('canvas');
        canvas.width = rect.width;
        canvas.height = rect.height;
    });
</script>
    </body>
</html>
